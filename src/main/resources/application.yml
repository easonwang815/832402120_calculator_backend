# ============ 开发环境（默认） ============
# 数据库：H2 文件模式。数据持久化在 ./data/calculator 文件中，
# 后端重启历史不丢失，无需安装任何数据库软件。
server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:8000,http://127.0.0.1:8000}"

spring:
  datasource:
    url: jdbc:h2:file:./data/calculator;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

---
# ============ 生产环境（部署时启用：--spring.profiles.active=prod） ============
# 数据库：MySQL。连接参数通过环境变量注入，不写死在配置文件中。
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useSSL=false&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  h2:
    console:
      enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-mysql.sql
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
